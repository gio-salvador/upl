name: CI

# Actions are pinned by commit SHA; a tag is mutable, and a mutable dependency in a gate is
# not a gate. Adapted from salvador-cloud-site (MIT), see THIRD-PARTY-NOTICES.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Site gate (lint, build, links, SEO)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm --prefix site ci

      # The same entry point as the pre-PR check: markdown lint, build, link gate, SEO gate.
      - name: Site gate
        env:
          SITE: ${{ vars.SITE || format('https://{0}.pages.dev', vars.PAGES_PROJECT_NAME || 'unified-path-of-light') }}
        run: bash scripts/check.sh site

  mobile:
    name: Mobile and desktop rendering (every page, four widths)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the decision below compares against the base branch

      # The gate runs only if something that can change rendering changed: on a pull request,
      # since the base branch; on a push to main, since the commit main pointed at before it.
      # The skip happens here, inside the job, and not with a workflow `paths` filter: a job
      # that never starts never reports, and would block every docs-only pull request forever
      # once this check is required on main. A manual run has no change to compare, and is a
      # request for the gate, so it always runs it.
      - name: Decide whether rendering can have changed
        id: visual
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="origin/${BASE_REF}" ;;
            # The script fails open: a first push, where there is no earlier commit, runs the gate.
            push) base="${BEFORE}" ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Manual run: running the full rendering gate." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          # The decision is the script's own exit status, so its output is captured, not piped:
          # this shell runs without pipefail, and a pipe to tee reports tee's status, which
          # made the gate run on every pull request.
          if out="$(bash scripts/visual-changed.sh "$base")"; then run=true; else run=false; fi
          printf '%s\n' "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo "::notice title=Rendering gate skipped::No file that can affect rendering changed."
          fi

      - name: Setup Node
        if: steps.visual.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        if: steps.visual.outputs.run == 'true'
        run: npm --prefix site ci

      # The browser build is tied to the exact playwright version in the lockfile.
      - name: Install Chromium
        if: steps.visual.outputs.run == 'true'
        run: npx --prefix site playwright install --with-deps chromium

      - name: Build
        if: steps.visual.outputs.run == 'true'
        env:
          SITE: ${{ vars.SITE || format('https://{0}.pages.dev', vars.PAGES_PROJECT_NAME || 'unified-path-of-light') }}
        run: npm --prefix site run build

      - name: Rendering gate
        if: steps.visual.outputs.run == 'true'
        run: bash scripts/check.sh mobile

  gates:
    name: Toolkit gates (docs, claims, plans, hardcoding, public readiness)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gates are the pinned copy vendored under .claude/toolkit, so CI needs no access to
      # the toolkit repository and an upgrade arrives as a reviewable diff.
      # The sensitive-token scan does not run here. Its list of client names and personal
      # identifiers is never committed and is not handed to GitHub as a secret either, so it
      # stays on the author's machine. The scan runs there instead: in `scripts/check.sh`, and
      # again in the pre-push hook, which blocks a push on a public-tier repository when the
      # scan cannot run. Without a list the public-readiness gate below says so in a warning
      # and checks everything else it covers.
      - name: Run vendored gates
        run: bash scripts/check.sh gates

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks binary, pinned by version and verified by SHA-256.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history
        run: gitleaks detect --source . --redact --no-banner
