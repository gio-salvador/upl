name: CI

# Actions are pinned by commit SHA; a tag is mutable, and a mutable dependency in a gate is
# not a gate. Adapted from salvador-cloud-site (MIT), see THIRD-PARTY-NOTICES.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Site gate (lint, build, links, SEO)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm --prefix site ci

      # The same entry point as the pre-PR check: markdown lint, build, link gate, SEO gate.
      - name: Site gate
        env:
          SITE: ${{ vars.SITE || format('https://{0}.pages.dev', vars.PAGES_PROJECT_NAME || 'unified-path-of-light') }}
        run: bash scripts/check.sh site

  mobile:
    name: Mobile and desktop rendering (every page, four widths)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm --prefix site ci

      # The browser build is tied to the exact playwright version in the lockfile.
      - name: Install Chromium
        run: npx --prefix site playwright install --with-deps chromium

      - name: Build
        env:
          SITE: ${{ vars.SITE || format('https://{0}.pages.dev', vars.PAGES_PROJECT_NAME || 'unified-path-of-light') }}
        run: npm --prefix site run build

      - name: Rendering gate
        run: bash scripts/check.sh mobile

  gates:
    name: Toolkit gates (docs, claims, plans, hardcoding, public readiness)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gates are the pinned copy vendored under .claude/toolkit, so CI needs no access to
      # the toolkit repository and an upgrade arrives as a reviewable diff.
      # The sensitive-token list is never committed. When the SENSITIVE_TOKENS secret holds it
      # (one token per line), the public-readiness gate scans every tracked file against it.
      # Without the secret that one check is off, and says so.
      - name: Run vendored gates
        env:
          SENSITIVE_TOKENS: ${{ secrets.SENSITIVE_TOKENS }}
        run: |
          set -euo pipefail
          if [ -n "${SENSITIVE_TOKENS}" ]; then
            SCT_TOKENS_FILE="$(mktemp)"
            printf '%s\n' "${SENSITIVE_TOKENS}" > "${SCT_TOKENS_FILE}"
            export SCT_TOKENS_FILE
          else
            echo "::notice title=Token scan off::The SENSITIVE_TOKENS secret is not set, so the sensitive-token scan did not run."
          fi
          bash scripts/check.sh gates

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks binary, pinned by version and verified by SHA-256.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history
        run: gitleaks detect --source . --redact --no-banner
