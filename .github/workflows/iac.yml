name: IaC

# OpenTofu for the Cloudflare Pages project and, once SITE_DOMAIN is set, its custom domain. fmt and validate always run. plan (on pull
# requests) and apply (on main) stay off until the repository variable IAC_ENABLED is 'true',
# which is set once the state bucket and the secrets exist. Adapted from salvador-cloud-site
# (MIT), see THIRD-PARTY-NOTICES.md.

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/iac.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/iac.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false # never cancel an apply mid-flight

env:
  TOFU_VERSION: "1.11.6"

jobs:
  fmt-validate:
    name: tofu fmt + validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt -check
        working-directory: infra
        run: tofu fmt -check -diff

      - name: tofu init (no backend)
        working-directory: infra
        run: tofu init -backend=false -input=false

      - name: tofu validate
        working-directory: infra
        run: tofu validate

  plan:
    name: tofu plan (pull request comment)
    runs-on: ubuntu-24.04
    # Secrets are not available to pull requests from forks, so plan runs for same-repo
    # branches only.
    if: >-
      github.event_name == 'pull_request' && vars.IAC_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: fmt-validate
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
        run: |
          tofu init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="endpoints={s3=\"${STATE_ENDPOINT}\"}"

      - name: tofu plan
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_pages_project_name: ${{ vars.PAGES_PROJECT_NAME }}
          TF_VAR_site_origin: ${{ vars.SITE }}
          TF_VAR_site_domain: ${{ vars.SITE_DOMAIN }}
        run: tofu plan -input=false -no-color -lock=false | tee tfplan.txt

      - name: Post plan to the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tfplan.txt', 'utf8');
            const body = plan.length > 60000 ? plan.slice(0, 60000) + '\n... truncated ...' : plan;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### tofu plan\n\n```text\n' + body + '\n```',
            });

  apply:
    name: tofu apply
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.IAC_ENABLED == 'true'
    needs: fmt-validate
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
          STATE_BUCKET: ${{ secrets.TOFU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ secrets.TOFU_STATE_ENDPOINT }}
        run: |
          tofu init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="endpoints={s3=\"${STATE_ENDPOINT}\"}"

      - name: tofu apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_pages_project_name: ${{ vars.PAGES_PROJECT_NAME }}
          TF_VAR_site_origin: ${{ vars.SITE }}
          TF_VAR_site_domain: ${{ vars.SITE_DOMAIN }}
        run: tofu apply -input=false -auto-approve
