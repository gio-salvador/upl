name: Security

# Adapted from salvador-cloud-site (MIT), see THIRD-PARTY-NOTICES.md.

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  push:
    branches: [main]
  # On pull requests too, so the scan can be a required check on main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CodeQL is not run from here. GitHub's code scanning default setup covers JavaScript and
  # TypeScript, Python and the workflows, and it rejects results uploaded by a workflow job
  # while it is on.
  osv-scan:
    name: OSV-Scanner (dependency CVEs)
    # The reusable workflow asks for a write permission that a pull request from a fork cannot
    # be given, so those are scanned when they reach main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=site/package-lock.json
      fail-on-vuln: true
      upload-sarif: false
