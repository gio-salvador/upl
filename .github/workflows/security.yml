name: Security

# Adapted from salvador-cloud-site (MIT), see THIRD-PARTY-NOTICES.md.

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  push:
    branches: [main]
  # On pull requests too, so both scans can be required checks on main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL JavaScript / TypeScript
    # Code scanning is free on public repositories only.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  osv-scan:
    name: OSV-Scanner (dependency CVEs)
    # The reusable workflow asks for a write permission that a pull request from a fork cannot
    # be given, so those are scanned when they reach main.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --lockfile=site/package-lock.json
      fail-on-vuln: true
      upload-sarif: false
