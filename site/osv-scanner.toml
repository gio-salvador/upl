# Advisories the OSV scan is told to pass over, each with a reason and an expiry.
# osv-scanner reads this file because it sits beside the lockfile it scans.
#
# The rules for an entry:
#   - one advisory per entry, by id, never a whole package
#   - a reason that says why it does not reach this site and what would remove the entry
#   - an ignoreUntil no more than a month out, so the entry comes back for review
# When an entry expires the scan fails again. Re-check the advisory then: remove the entry
# if a fixed version exists, extend it only with a fresh reason.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-05T00:00:00Z
reason = "braces <= 3.0.3, stack exhaustion on deeply nested patterns. No fixed version exists. Development only: it arrives through markdownlint-cli2 (globby, fast-glob, micromatch) and only expands the glob patterns this repository passes to the linter. Nothing from it is built into the site. Remove when a fixed braces is released."
